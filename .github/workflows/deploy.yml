name: Deploy by Branch

on:
  pull_request:
    branches: [dev, stage, prod]

  push:
    branches: [dev, stage, prod]

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run against"
        type: choice
        required: true
        options: [dev, stage, prod]

      component:
        description: "Terraform component"
        type: choice
        required: true
        options: [s3, networking, redshift , ec2 , lambda ]

      action:
        description: "Terraform action"
        type: choice
        required: true
        options: [plan, apply, destroy]

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ github.event_name }}-${{ github.ref_name || inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref }}

    strategy:
      matrix:
        component: [s3, networking , redshift , ec2 , lambda ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=terraform/components/${{ matrix.component }} init -reconfigure

      - name: Terraform Format Check
        run: terraform -chdir=terraform/components/${{ matrix.component }} fmt -check

      - name: Terraform Validate
        run: terraform -chdir=terraform/components/${{ matrix.component }} validate
      
      - name: Terraform Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/components/${{ matrix.component }}
          framework: terraform
          skip_check: CKV2_AWS_62,CKV_AWS_18,CKV_AWS_144,CKV_AWS_130,CKV2_AWS_12,CKV2_AWS_11,CKV_AWS_87,CKV_AWS_71,CKV_AWS_142,CKV_AWS_321,CKV_AWS_64,CKV_AWS_282 , CKV_AWS_135,CKV_AWS_116,CKV_AWS_115,CKV_AWS_117,CKV_AWS_50,CKV_AWS_272 ,CKV_AWS_287, CKV_AWS_355,CKV_AWS_290, CKV_AWS_173

      - name: Terraform Plan
        run: |
          if [ "${{ matrix.component }}" = "redshift" ]; then
            terraform -chdir=terraform/components/${{ matrix.component }} plan \
              -var="environment=${{ github.base_ref }}" \
              -var="master_password=${{ secrets.REDSHIFT_MASTER_PASSWORD }}"
          else
            terraform -chdir=terraform/components/${{ matrix.component }} plan \
              -var="environment=${{ github.base_ref }}"
          fi

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    strategy:
      matrix:
        component: [s3, networking, redshift, ec2 , lambda ] 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Confirm AWS account
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=terraform/components/${{ matrix.component }} init -reconfigure

      - name: Terraform Apply
        run: |
          if [ "${{ matrix.component }}" = "redshift" ]; then
            terraform -chdir=terraform/components/${{ matrix.component }} apply \
              -var="environment=${{ github.ref_name }}" \
              -var="master_password=${{ secrets.REDSHIFT_MASTER_PASSWORD }}" \
              -auto-approve
          else
            terraform -chdir=terraform/components/${{ matrix.component }} apply \
              -var="environment=${{ github.ref_name }}" \
              -auto-approve
          fi


  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm AWS account
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=terraform/components/${{ inputs.component }} init -reconfigure

      - name: Terraform Plan
        if: inputs.action == 'plan'
        run: |
          terraform -chdir=terraform/components/${{ inputs.component }} plan \
            -var="environment=${{ inputs.environment }}" \
            -var="master_password=${{ secrets.REDSHIFT_MASTER_PASSWORD }}" \

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: |
          if [ "${{ inputs.component }}" = "redshift" ]; then
            terraform -chdir=terraform/components/${{ inputs.component }} apply \
              -var="environment=${{ inputs.environment }}" \
              -var="master_password=${{ secrets.REDSHIFT_MASTER_PASSWORD }}" \
              -auto-approve
          else
            terraform -chdir=terraform/components/${{ inputs.component }} apply \
              -var="environment=${{ inputs.environment }}" \
              -auto-approve
          fi

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: |
          terraform -chdir=terraform/components/${{ inputs.component }} destroy \
            -var="environment=${{ inputs.environment }}" \
            -auto-approve